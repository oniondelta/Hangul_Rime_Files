name: Release-sort_Hangul_Rime_Files_output

on:
  workflow_dispatch: # 手動觸發

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 確保有權限建立 Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: 'main'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      - name: 執行 Python 與檔案處理
        run: |
          # 取得台北時間（+8）的當天日期
          RELEASE_DATE=$(TZ="Asia/Taipei" date +"%Y%m%d")
          echo "TODAY_DATE=${RELEASE_DATE}" >> $GITHUB_ENV

          # 執行您的 Python 腳本
          python sort_Hangul_Rime_Files.py
          BASEDIR=`pwd`
          FOLDER=`find ${BASEDIR} -name "電腦RIME韓文方案*" -type d`
          OUTPUT="${BASEDIR}/output"
          mkdir -p $OUTPUT

          # function create_zip1() {
          #     SOURCE=`find ${FOLDER} -name "$1" -type d`
          #     cd $SOURCE
          #     zip -qq -r ${OUTPUT}/$2 ./
          # }

          # function create_zip2() {
          #     SOURCE=`find ${FOLDER} -name "$1" -type d`
          #     cd $SOURCE && cd ..
          #     zip -qq -r ${OUTPUT}/$2 $1
          # }

          function remove_dir() {
              SOURCE=`find ${FOLDER} -name "$1" -type d`
              rm -r $SOURCE
          }

          # 刪除不需要的資料夾
          # remove_dir "資料夾名稱"

          # （解壓縮後資料夾名稱為：Onion_Hangul_Rime_Files）
          # 將調整後的整個「電腦RIME韓文方案*」資料夾壓縮成 Onion_Hangul_Rime_Files.zip 並放到 output 目錄
          # cd $FOLDER
          # zip -qq -r ${OUTPUT}/Onion_Hangul_Rime_Files.zip ./
          # zip -qq -r ${OUTPUT}/Onion_Hangul_Rime_Files-${RELEASE_DATE}.zip ./

          # （解壓縮後資料夾名稱為：Onion_Hangul_Rime_Files）
          # 使用前面 create_zip1 函數壓縮
          # create_zip1 "電腦RIME韓文方案*" "Onion_Hangul_Rime_Files-${RELEASE_DATE}.zip"

          # （解壓縮後資料夾名稱為：電腦RIME韓文方案*）
          # 使用前面 create_zip2 函數壓縮
          # create_zip2 "電腦RIME韓文方案*" "Onion_Hangul_Rime_Files-${RELEASE_DATE}.zip"

          # （解壓縮後資料夾名稱為：電腦RIME韓文方案*）
          # 進入該資料夾，並立刻退回它的上一層
          # cd $FOLDER && cd ..
          # 直接指定打包「電腦RIME韓文方案*」這個資料夾
          # zip -qq -r ${OUTPUT}/Onion_Hangul_Rime_Files-${RELEASE_DATE}.zip 電腦RIME韓文方案*

          # （解壓縮後資料夾名稱為：電腦RIME韓文方案*）
          # 取得純資料夾名稱（例如："電腦RIME韓文方案*"）
          FOLDER_NAME=$(basename "$FOLDER")
          # 切換到該資料夾的上一層目錄
          cd "$(dirname "$FOLDER")"
          # 打包該資料夾（加上雙引號，防止名稱中有空白字元導致報錯）
          zip -qq -r "${OUTPUT}/Onion_Hangul_Rime_Files-${RELEASE_DATE}.zip" "${FOLDER_NAME}"

      # 新增步驟：自動建立 GitHub Release 並上傳 zip 檔案
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          # artifacts: "output/Onion_Hangul_Rime_Files.zip"
          artifacts: "output/Onion_Hangul_Rime_Files-${{ env.TODAY_DATE }}.zip"
          # 調用上方日期變數，tag：release_{當天日期}
          tag: "release_${{ env.TODAY_DATE }}"
          # 調用上方日期變數，name：洋蔥韓文方案_{當天日期}
          name: "洋蔥韓文方案_${{ env.TODAY_DATE }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 方案

            - 含〈韓語2set〉〈韓語HNC〉〈韓語形碼〉。

            ## 使用方法

            - Onion_Hangul_Rime_Files 之 zip 檔內，各個方案所需文件，分別放置於其內『方案名稱』資料夾。

            - 選取欲使用方案，內含文件通通放入『 Rime 』用戶設定資料夾，「重新部署」方可。

            - 方案放置路徑：

              > 別放錯資料夾，反饋有人放錯放到程式預設方案資料夾！有些方案會因 lua 無法執行產生 Bug。

              > ```
              > %APPDATA%\Rime  ( Windows 小狼毫 )
              > ~/Library/Rime  ( Mac OS 鼠鬚管 )
              > ~/.config/ibus/rime  ( Linux 中州韻 )
              > ~/.config/fcitx/rime  ( Linux )
              > ~/.local/share/fcitx5/rime ( Linux )
              > ```

            - 欲同時使用多個主方案：其方案檔案皆須放入，除 `opencc` 該資料夾不能整個覆蓋，其餘同檔名覆蓋。把多個方案內含之 `default.custom.yaml` 該檔，其 `schema_list:` 底下所有 `- schema:` 項目，合併（去重，可把常使用的主方案順序置前）。以上修改成一個 `default.custom.yaml` 並置入『 Rime 』用戶設定資料夾，重新部署。

            - 除 `default.custom.yaml` 、 `README.md` 、 `img 資料夾` 之外，Onion_Hangul_Rime_Files.zip 內，三個方案資料夾內（不包含「其他」資料夾），同名稱檔案，內容為相同。

